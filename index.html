<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Noktaları Birleştir — MaviBlue Stüdyo</title>
  <style>
    :root {
      --bg-desk: #ede7d9;
      --paper: #fdfaf2;
      --paper-border: #dcd3be;
      --ink: #2c353d;
      --muted: #6c757d;
      --accent: #d96b43;
      --accent-soft: #f5dfd6;
      --success: #2a856e;
      --studio-blue: #1e6091;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-desk);
      background-image: radial-gradient(#d8cfbc 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      background: var(--paper);
      border: 1px solid var(--paper-border);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(44, 53, 61, 0.08);
      padding: 20px 24px 26px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 2px dashed var(--paper-border);
    }

    .brand-wrapper {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .studio-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--studio-blue);
      text-decoration: none;
      width: fit-content;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .studio-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .badge {
      background: #f0d78c;
      color: #5c4812;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    button.icon-btn {
      background: #f4efe4;
      border: 1px solid var(--paper-border);
      color: var(--ink);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.icon-btn:hover {
      background: #eae2d0;
    }

    button.icon-btn.hint-btn {
      background: #fdf3eb;
      border-color: #ecc6b5;
      color: #b54d27;
    }

    button.icon-btn.hint-btn:hover {
      background: #f9e4d6;
    }

    .level-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .level-tab {
      background: #f4efe4;
      border: 1px solid var(--paper-border);
      color: var(--ink);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .level-tab.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .level-tab.completed::after {
      content: " ✓";
      color: #6ee7b7;
      font-weight: 800;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .counter-pill {
      background: #e3f1ec;
      color: var(--success);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #ebe4d3;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--success);
      transition: width 0.25s ease;
    }

    .board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 600px;
      background: #fffdf8;
      border: 1.5px solid var(--paper-border);
      border-radius: 16px;
      overflow: hidden;
      touch-action: none;
    }

    .zoom-controls {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      gap: 4px;
      background: rgba(253, 250, 242, 0.92);
      border: 1px solid var(--paper-border);
      padding: 4px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .zoom-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }

    .zoom-btn:hover {
      background: #ebe4d3;
    }

    svg#game-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #reveal-image {
      opacity: 0;
      transition: opacity 0.9s ease-in-out;
      pointer-events: none;
    }

    #reveal-image.visible {
      opacity: 1;
    }

    /* Çizgi geçişleri: Oyun sırasında net, finalde ince ve silik */
    #lines-layer line {
      stroke: #3b4248;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.88;
      transition: stroke-width 0.8s ease, opacity 0.8s ease, stroke 0.8s ease;
    }

    #lines-layer.faded line {
      stroke: #495057;
      stroke-width: 1.2;
      opacity: 0.2;
    }

    .dot-group {
      cursor: pointer;
      transition: opacity 0.7s ease;
    }

    .dot-group.faded {
      opacity: 0.16;
      pointer-events: none;
    }

    .dot-circle {
      fill: #ffffff;
      stroke: var(--ink);
      stroke-width: 2;
      transition: r 0.15s ease, fill 0.15s ease, stroke 0.15s ease;
    }

    .dot-group.done .dot-circle {
      fill: var(--ink);
      stroke: var(--ink);
    }

    .dot-group.next .dot-circle {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2.8;
    }

    .dot-pulse {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      opacity: 0;
      pointer-events: none;
    }

    .dot-group.next .dot-pulse {
      animation: pulseRing 1.4s infinite ease-out;
    }

    @keyframes pulseRing {
      0% { r: 7; opacity: 0.85; }
      100% { r: 20; opacity: 0; }
    }

    /* İpucu Radar Efekti */
    #radar-ring {
      fill: rgba(217, 107, 67, 0.14);
      stroke: var(--accent);
      stroke-width: 2.5;
      pointer-events: none;
      opacity: 0;
    }

    #radar-ring.ping {
      animation: radarPing 1.1s ease-out 2;
    }

    @keyframes radarPing {
      0% { r: 6; opacity: 0.95; stroke-width: 3; }
      100% { r: 58; opacity: 0; stroke-width: 1; }
    }

    .dot-label {
      font-size: 13px;
      font-weight: 700;
      fill: var(--ink);
      pointer-events: none;
    }

    .dot-group.next .dot-label {
      fill: var(--accent);
      font-size: 14px;
    }

    .shake {
      animation: shakeAnim 0.28s ease;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .victory-banner {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      background: #e6f4ef;
      border: 1px solid #b7dfd1;
      border-radius: 12px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .victory-banner.show {
      display: flex;
    }

    .victory-text {
      font-weight: 700;
      color: #1e6351;
    }

    .next-btn {
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .kbd-hint {
      margin-top: 12px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
    }

    .empty-state h3 {
      margin: 10px 0 6px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="brand-wrapper">
        <a href="https://maviblue.win" target="_blank" rel="noopener noreferrer" class="studio-link" title="maviblue.win sitesini ziyaret et">
          MaviBlue Stüdyo Sunar ↗
        </a>
        <div class="brand">
          <span style="font-size: 1.5rem;">✏️</span>
          <h1>Noktaları Birleştir</h1>
          <span class="badge">BULMACA</span>
        </div>
      </div>
      <div class="controls">
        <button class="icon-btn hint-btn" id="btn-hint" title="Sıradaki noktayı göster (Kısayol: H)">💡 İpucu</button>
        <button class="icon-btn" id="btn-sound" title="Sesi Aç/Kapat">🔊 Ses Açık</button>
        <button class="icon-btn" id="btn-reset" title="Bölümü Sıfırla (Kısayol: R)">↺ Sıfırla</button>
      </div>
    </header>

    <div class="level-tabs" id="level-tabs"></div>

    <div class="status-bar">
      <span id="status-text">Bulmacalar yükleniyor...</span>
      <span class="counter-pill" id="counter-pill">Nokta: 0 / 0</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="board-wrapper" id="board-wrapper">
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-out" title="Uzaklaş (-)">−</button>
        <button class="zoom-btn" id="zoom-reset" title="Sıfırla">100%</button>
        <button class="zoom-btn" id="zoom-in" title="Yakınlaş (+)">+</button>
      </div>

      <div class="empty-state" id="empty-state">
        <div style="font-size: 2.5rem;">📖</div>
        <h3>Bulmacalar Yükleniyor</h3>
        <p id="empty-desc">Lütfen bekleyin...</p>
      </div>

      <svg id="game-svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
        <g id="viewport-group">
          <image id="reveal-image" x="0" y="0" width="600" height="600" preserveAspectRatio="xMidYMid meet" />
          <g id="lines-layer"></g>
          <line id="drag-guide" x1="0" y1="0" x2="0" y2="0" stroke="#d96b43" stroke-width="1.8" stroke-dasharray="5,5" visibility="hidden" />
          <circle id="radar-ring" cx="0" cy="0" r="6" />
          <g id="dots-layer"></g>
        </g>
      </svg>
    </div>

    <div class="victory-banner" id="victory-banner">
      <span class="victory-text" id="victory-title">Harika! Resmi ortaya çıkardın.</span>
      <button class="next-btn" id="btn-next-level">Sonraki Bulmaca →</button>
    </div>

    <div class="kbd-hint">
      İpucu: <b>H</b> · Sonraki Noktayı Birleştir: <b>Boşluk</b> · Yakınlaştır: <b>+ / -</b> veya <b>Fare Tekerleği</b>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'noktalari_birlestir_tamamlananlar_v1';

    let levels = [];
    let currentLevelIndex = 0;
    let currentStep = 0;
    let isDrawing = false;
    let soundEnabled = true;
    let completedTitles = new Set();
    let audioCtx = null;

    let zoomScale = 1;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;

    const svg = document.getElementById('game-svg');
    const viewportGroup = document.getElementById('viewport-group');
    const linesLayer = document.getElementById('lines-layer');
    const dotsLayer = document.getElementById('dots-layer');
    const dragGuide = document.getElementById('drag-guide');
    const radarRing = document.getElementById('radar-ring');
    const revealImage = document.getElementById('reveal-image');
    const levelTabs = document.getElementById('level-tabs');
    const statusText = document.getElementById('status-text');
    const counterPill = document.getElementById('counter-pill');
    const progressFill = document.getElementById('progress-fill');
    const victoryBanner = document.getElementById('victory-banner');
    const emptyState = document.getElementById('empty-state');
    const emptyDesc = document.getElementById('empty-desc');
    const zoomResetBtn = document.getElementById('zoom-reset');

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const arr = JSON.parse(saved);
          if (Array.isArray(arr)) completedTitles = new Set(arr);
        }
      } catch (e) {}
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedTitles]));
      } catch (e) {}
    }

    function playTone(freq, type = 'sine', duration = 0.09, gainVal = 0.08) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playVictoryFanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => {
        setTimeout(() => playTone(n, 'triangle', 0.25, 0.09), i * 110);
      });
    }

    function applyTransform() {
      const maxPan = (zoomScale - 1) * 300;
      panX = Math.max(-maxPan, Math.min(maxPan, panX));
      panY = Math.max(-maxPan, Math.min(maxPan, panY));
      const cx = 300;
      const cy = 300;
      viewportGroup.setAttribute(
        'transform',
        `translate(${panX}, ${panY}) translate(${cx}, ${cy}) scale(${zoomScale}) translate(${-cx}, ${-cy})`
      );
      zoomResetBtn.textContent = Math.round(zoomScale * 100) + '%';
    }

    function setZoom(newScale) {
      zoomScale = Math.max(1, Math.min(3, newScale));
      if (zoomScale === 1) {
        panX = 0;
        panY = 0;
      }
      applyTransform();
    }

    async function loadPuzzles() {
      loadProgress();
      try {
        const response = await fetch('./bulmacalar.json?t=' + Date.now());
        if (!response.ok) throw new Error('bulmacalar.json bulunamadı.');
        const data = await response.json();
        const list = Array.isArray(data) ? data : (data.puzzles || data.levels || []);
        if (!list.length) throw new Error('bulmacalar.json içinde henüz bölüm yok.');
        levels = list;
        emptyState.style.display = 'none';
        renderTabs();
        startLevel(0);
      } catch (err) {
        statusText.textContent = 'Bulmaca paketi yüklenemedi.';
        emptyDesc.textContent = 'Bu dizinde "bulmacalar.json" dosyası bulunamadı veya henüz içerik eklenmemiş.';
      }
    }

    function getLevelKey(lvl, idx) {
      return lvl.title || `level_${idx}`;
    }

    function renderTabs() {
      levelTabs.innerHTML = '';
      levels.forEach((lvl, idx) => {
        const key = getLevelKey(lvl, idx);
        const btn = document.createElement('button');
        btn.className =
          'level-tab' +
          (idx === currentLevelIndex ? ' active' : '') +
          (completedTitles.has(key) ? ' completed' : '');
        btn.textContent = lvl.title || `${idx + 1}. Bulmaca`;
        btn.onclick = () => startLevel(idx);
        levelTabs.appendChild(btn);
      });
    }

    function startLevel(index) {
      currentLevelIndex = index;
      currentStep = 0;
      isDrawing = false;
      setZoom(1);
      dragGuide.setAttribute('visibility', 'hidden');
      radarRing.classList.remove('ping');
      victoryBanner.classList.remove('show');
      linesLayer.innerHTML = '';
      linesLayer.classList.remove('faded');
      dotsLayer.innerHTML = '';

      const level = levels[index];
      const vb = Array.isArray(level.viewBox) && level.viewBox.length === 4
        ? level.viewBox.join(' ')
        : (Array.isArray(level.viewBox) && level.viewBox.length === 2
          ? `0 0 ${level.viewBox[0]} ${level.viewBox[1]}`
          : '0 0 600 600');
      svg.setAttribute('viewBox', vb);

      const parts = vb.split(' ').map(Number);
      revealImage.setAttribute('x', parts[0] || 0);
      revealImage.setAttribute('y', parts[1] || 0);
      revealImage.setAttribute('width', parts[2] || 600);
      revealImage.setAttribute('height', parts[3] || 600);

      revealImage.classList.remove('visible');
      if (level.image) {
        revealImage.setAttribute('href', level.image);
      } else {
        revealImage.removeAttribute('href');
      }

      const pts = level.points || [];
      pts.forEach((pt, i) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'dot-group' + (i === 0 ? ' next' : ''));
        g.dataset.index = i;

        const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        pulse.setAttribute('class', 'dot-pulse');
        pulse.setAttribute('cx', pt.x);
        pulse.setAttribute('cy', pt.y);
        pulse.setAttribute('r', '7');

        const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        hitArea.setAttribute('cx', pt.x);
        hitArea.setAttribute('cy', pt.y);
        hitArea.setAttribute('r', '18');
        hitArea.setAttribute('fill', 'transparent');

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'dot-circle');
        circle.setAttribute('cx', pt.x);
        circle.setAttribute('cy', pt.y);
        circle.setAttribute('r', '6');

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('class', 'dot-label');
        label.setAttribute('x', pt.x + 10);
        label.setAttribute('y', pt.y - 9);
        label.textContent = i + 1;

        g.appendChild(pulse);
        g.appendChild(hitArea);
        g.appendChild(circle);
        g.appendChild(label);

        g.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          handleDotInteract(i);
          if (currentStep > 0 && currentStep < pts.length) {
            isDrawing = true;
          }
        });

        g.addEventListener('pointerenter', () => {
          if (isDrawing) {
            handleDotInteract(i);
          }
        });

        dotsLayer.appendChild(g);
      });

      renderTabs();
      updateStatus();
    }

    function handleDotInteract(index) {
      const level = levels[currentLevelIndex];
      const pts = level.points || [];
      if (currentStep >= pts.length) return;

      if (index === currentStep) {
        const pt = pts[index];
        const prevPt = index > 0 ? pts[index - 1] : null;

        if (prevPt && !pt.break) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', prevPt.x);
          line.setAttribute('y1', prevPt.y);
          line.setAttribute('x2', pt.x);
          line.setAttribute('y2', pt.y);
          linesLayer.appendChild(line);
        }

        const groups = dotsLayer.querySelectorAll('.dot-group');
        groups[index].classList.remove('next');
        groups[index].classList.add('done');

        playTone(340 + index * 14, 'sine', 0.08, 0.08);
        currentStep++;

        if (currentStep < pts.length) {
          groups[currentStep].classList.add('next');
          if (pts[currentStep].break) {
            isDrawing = false;
            dragGuide.setAttribute('visibility', 'hidden');
          }
        } else {
          finishLevel();
        }
        updateStatus();
      } else if (index > currentStep) {
        const groups = dotsLayer.querySelectorAll('.dot-group');
        groups[index].classList.add('shake');
        playTone(150, 'sawtooth', 0.12, 0.05);
        setTimeout(() => groups[index].classList.remove('shake'), 300);
      }
    }

    function triggerHint() {
      const level = levels[currentLevelIndex];
      if (!level || !level.points || currentStep >= level.points.length) return;
      const target = level.points[currentStep];

      radarRing.setAttribute('cx', target.x);
      radarRing.setAttribute('cy', target.y);
      radarRing.classList.remove('ping');
      void radarRing.offsetWidth;
      radarRing.classList.add('ping');

      playTone(880, 'sine', 0.16, 0.07);
    }

    function finishLevel() {
      isDrawing = false;
      dragGuide.setAttribute('visibility', 'hidden');
      setZoom(1);

      const level = levels[currentLevelIndex];
      completedTitles.add(getLevelKey(level, currentLevelIndex));
      saveProgress();
      renderTabs();
      playVictoryFanfare();

      const groups = dotsLayer.querySelectorAll('.dot-group');
      groups.forEach(g => g.classList.add('faded'));
      linesLayer.classList.add('faded');

      if (level.image) {
        revealImage.classList.add('visible');
      }

      document.getElementById('victory-title').textContent =
        `Tebrikler! "${level.title || 'Bulmaca'}" tamamlandı.`;
      victoryBanner.classList.add('show');
    }

    function updateStatus() {
      const level = levels[currentLevelIndex];
      const total = (level && level.points) ? level.points.length : 0;
      counterPill.textContent = `Nokta: ${currentStep} / ${total}`;
      const pct = total > 0 ? Math.round((currentStep / total) * 100) : 0;
      progressFill.style.width = pct + '%';

      if (total === 0) {
        statusText.textContent = 'Bölümde nokta bulunamadı.';
      } else if (currentStep === 0) {
        statusText.textContent = 'Başlamak için 1 numaralı noktaya tıkla veya dokun.';
      } else if (currentStep < total) {
        const nextPt = level.points[currentStep];
        statusText.textContent = nextPt.break
          ? `Kalemi kaldır! Şimdi ${currentStep + 1} numaralı noktaya tıkla.`
          : `Sıradaki nokta: ${currentStep + 1} (tıkla veya sürükle)`;
      } else {
        statusText.textContent = 'Tüm noktalar birleşti!';
      }
    }

    svg.addEventListener('pointerdown', (e) => {
      if (zoomScale > 1 && !isDrawing) {
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
      }
    });

    svg.addEventListener('pointermove', (e) => {
      if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        applyTransform();
        return;
      }

      if (!isDrawing) return;
      const level = levels[currentLevelIndex];
      const pts = level.points || [];
      if (currentStep === 0 || currentStep >= pts.length) return;
      if (pts[currentStep].break) {
        dragGuide.setAttribute('visibility', 'hidden');
        return;
      }

      const pt = svg.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const cursor = pt.matrixTransform(viewportGroup.getScreenCTM().inverse());

      const lastPt = pts[currentStep - 1];
      dragGuide.setAttribute('x1', lastPt.x);
      dragGuide.setAttribute('y1', lastPt.y);
      dragGuide.setAttribute('x2', cursor.x);
      dragGuide.setAttribute('y2', cursor.y);
      dragGuide.setAttribute('visibility', 'visible');

      const target = pts[currentStep];
      const dist = Math.hypot(cursor.x - target.x, cursor.y - target.y);
      if (dist < 18) {
        handleDotInteract(currentStep);
      }
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
      isPanning = false;
      dragGuide.setAttribute('visibility', 'hidden');
    });

    document.getElementById('board-wrapper').addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      setZoom(zoomScale + delta);
    }, { passive: false });

    document.getElementById('zoom-in').onclick = () => setZoom(zoomScale + 0.35);
    document.getElementById('zoom-out').onclick = () => setZoom(zoomScale - 0.35);
    zoomResetBtn.onclick = () => setZoom(1);

    document.getElementById('btn-hint').onclick = triggerHint;

    document.getElementById('btn-sound').onclick = function () {
      soundEnabled = !soundEnabled;
      this.textContent = soundEnabled ? '🔊 Ses Açık' : '🔇 Ses Kapalı';
    };

    document.getElementById('btn-reset').onclick = () => {
      if (levels.length) startLevel(currentLevelIndex);
    };

    document.getElementById('btn-next-level').onclick = () => {
      if (!levels.length) return;
      const next = (currentLevelIndex + 1) % levels.length;
      startLevel(next);
    };

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        if (levels.length) handleDotInteract(currentStep);
      } else if (e.key.toLowerCase() === 'h') {
        triggerHint();
      } else if (e.key.toLowerCase() === 'r') {
        if (levels.length) startLevel(currentLevelIndex);
      } else if (e.key === '+' || e.key === '=') {
        setZoom(zoomScale + 0.35);
      } else if (e.key === '-') {
        setZoom(zoomScale - 0.35);
      }
    });

    loadPuzzles();
  </script>
</body>
</html>
